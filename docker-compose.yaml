services:
  mc-server:
    build: .
    environment:
      EULA: ${EULA:-false}
      MC_XMS: ${MC_XMS:-4G}
      MC_XMX: ${MC_XMX:-4G}
    ports:
      - "${PORT:-8888}:25565"
    volumes:
      - ./data:/data
      - ./config/server.properties:/config/server.properties:ro
    restart: unless-stopped
    stop_grace_period: 2m
