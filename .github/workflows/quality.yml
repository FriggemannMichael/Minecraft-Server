name: Quality

on:
  workflow_call:
  push:
    branches:
      - feature/minecraft_server
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Repo
        uses: actions/checkout@v7

      - name: Lint Github Workflows
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint:1.7.12

      - name: Scan files for secrets
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact=100 --no-banner /repo
