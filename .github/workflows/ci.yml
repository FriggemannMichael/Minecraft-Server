name: Build and test Minecraft server

on:
  workflow_call:
  push:
    branches:
      - feature/minecraft_server
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: minecraft-server:ci

      - name: Start Minecraft server
        id: start
        run: docker run --detach --name mc-smoke --publish 8888:25565 --env EULA=true minecraft-server:ci

      - name: Check server is running
        timeout-minutes: 5
        run: |
          python3 -m venv /tmp/mcstatus-venv
          /tmp/mcstatus-venv/bin/python -m pip install "mcstatus==14.2.0"
          for ATTEMPT in {1..30}; do
            echo "Checking Minecraft startup (attempt ${ATTEMPT}/30)"
            if /tmp/mcstatus-venv/bin/python -m mcstatus localhost:8888 status; then
              exit 0
            fi
            sleep 5
          done
          echo "Minecraft did not respond on port 8888" >&2
          exit 1

      - name: Show server logs on failure
        if: ${{ failure() && steps.start.outcome == 'success' }}
        run: docker logs --tail 100 mc-smoke

      - name: Remove test container
        if: ${{ always() && steps.start.outcome == 'success' }}
        run: docker rm --force mc-smoke
